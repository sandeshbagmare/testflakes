<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="testflakes: rank your flaky tests from the history you already have">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(46 68% 12%)">
        <animate attributeName="stop-color" values="hsl(46 68% 12%);hsl(46 62% 20%);hsl(46 68% 12%)" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="hsl(46 62% 20%)">
        <animate attributeName="stop-color" values="hsl(46 62% 20%);hsl(46 68% 12%);hsl(46 62% 20%)" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
